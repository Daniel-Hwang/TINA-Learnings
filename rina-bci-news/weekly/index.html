<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BCI 学术周报索引 | Weekly Summaries</title>
<style>
:root {
    --bg-primary: #0a0e17;
    --bg-secondary: #111827;
    --bg-card: #1a2332;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border-color: #2d3a4f;
    --accent-blue: #3b82f6;
    --accent-cyan: #06b6d4;
    --accent-green: #10b981;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    margin: 0;
}
.container { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
.hero { text-align: center; padding: 30px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 30px; }
.hero-title {
    font-size: 1.8rem; font-weight: 700;
    background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
}
.hero-subtitle { color: var(--text-secondary); font-size: 0.95rem; margin-top: 8px; }
.weekly-list { display: flex; flex-direction: column; gap: 12px; }
.weekly-index-item {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s ease;
}
.weekly-index-item:hover {
    border-color: var(--accent-green);
    transform: translateX(4px);
}
.weekly-index-link {
    color: var(--text-primary);
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
}
.weekly-index-link:hover { color: var(--accent-cyan); }
.weekly-index-range { color: var(--text-muted); font-size: 0.85rem; }
.back-link {
    display: inline-block;
    margin-top: 24px;
    padding: 10px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    color: var(--text-secondary);
    text-decoration: none;
    transition: all 0.2s ease;
}
.back-link:hover { border-color: var(--accent-blue); color: var(--text-primary); }
.footer { margin-top: 40px; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
</style>
<!-- GoatCounter Tracking -->
<script async="" data-goatcounter="https://daniel-hwang.goatcounter.com/count" src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="container">
  <header class="hero">
    <h1 class="hero-title">📚 BCI 学术周报索引</h1>
    <p class="hero-subtitle">所有历史周报归档</p>
  </header>
  <div class="weekly-list">
    
    <div class="weekly-index-item">
      <a href="2026-11-01.html" class="weekly-index-link">📅 2026年11月01日 周报</a>
      <span class="weekly-index-range">2026-10-26 ~ 2026-11-01</span>
    </div>

  </div>
  <div style="text-align: center;">
    <a href="../index.html" class="back-link">🏠 返回 BCI News 主页</a>
  </div>
  <div class="footer">
    <p>BCI News · Generated on 2026-10-26</p>
  </div>
</div>
</body>
</html>

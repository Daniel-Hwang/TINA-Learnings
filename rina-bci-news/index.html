const CATEGORIES = ["全部", "产业政策", "技术突破", "临床应用", "产品落地", "资本动态", "学术前沿", "技术路线", "核心器件", "产业落地"];
const CATEGORY_COLORS = {"产业政策": "#f59e0b", "技术突破": "#3b82f6", "临床应用": "#10b981", "产品落地": "#8b5cf6", "资本动态": "#ec4899", "学术前沿": "#06b6d4", "技术路线": "#f97316", "核心器件": "#84cc16", "产业落地": "#14b8a6"};
const REFERENCE_DATE = '2026-07-14';

let selectedCategory = '全部';
let selectedTimeRange = 'all';

function daysBetween(dateStr) {
  const ref = new Date(REFERENCE_DATE);
  const d = new Date(dateStr);
  return Math.floor((ref - d) / (1000 * 60 * 60 * 24));
}

function filterByTimeRange(items, range) {
  switch(range) {
    case '7d': return items.filter(i => daysBetween(i.date) <= 7);
    case '30d': return items.filter(i => daysBetween(i.date) <= 30);
    case '2026': return items.filter(i => i.date.startsWith('2026'));
    default: return items;
  }
}

function renderStars(hotness) {
  let html = '';
  for (let i = 0; i < 5; i++) {
    html += `<span class="star ${i < hotness ? '' : 'dim'}">★</span>`;
  }
  return html;
}

function renderCategoryTabs() {
  const timeFiltered = filterByTimeRange(NEWS_DATA, selectedTimeRange);
  const counts = { '全部': timeFiltered.length };
  for (const item of timeFiltered) {
    counts[item.category] = (counts[item.category] || 0) + 1;
  }
  
  const container = document.getElementById('categoryTabs');
  container.innerHTML = CATEGORIES.map(cat => {
    const count = counts[cat] || 0;
    const isActive = cat === selectedCategory;
    return `<button class="tab ${isActive ? 'active' : ''}" data-category="${cat}">
      ${cat}<span class="count">${count}</span>
    </button>`;
  }).join('');
  
  container.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      selectedCategory = tab.dataset.category;
      renderCategoryTabs();
      renderNewsGrid();
    });
  });
}

function renderNewsGrid() {
  let items = filterByTimeRange(NEWS_DATA, selectedTimeRange);
  if (selectedCategory !== '全部') {
    items = items.filter(i => i.category === selectedCategory);
  }
  
  // 按热度降序、日期降序排序
  items.sort((a, b) => b.hotness - a.hotness || (a.date < b.date ? 1 : -1));
  
  const grid = document.getElementById('newsGrid');
  
  if (items.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <p>暂无匹配的新闻</p>
        <p style="font-size: 0.875rem; margin-top: 8px;">尝试调整筛选条件</p>
      </div>
    `;
    return;
  }
  
  grid.innerHTML = items.map(item => {
    const color = CATEGORY_COLORS[item.category] || '#64748b';
    const sourceDisplay = item.sourceUrl 
      ? `<a href="${item.sourceUrl}" target="_blank" rel="noopener noreferrer" title="查看原文">${item.source} ↗</a>`
      : item.source;
    
    return `
      <article class="news-card" onclick="${item.sourceUrl ? `window.open('${item.sourceUrl}', '_blank')` : ''}">
        <div class="card-header">
          <span class="category-tag" style="background: ${color}20; color: ${color};">${item.category}</span>
          <div class="hotness">${renderStars(item.hotness)}</div>
        </div>
        <h3 class="card-title">${item.title}</h3>
        <p class="card-summary">${item.summary}</p>
        <ul class="card-points">
          ${item.keyPoints.map(p => `<li>${p}</li>`).join('')}
        </ul>
        <div class="card-footer">
          <span class="source">${sourceDisplay}</span>
          <span class="date">${item.date}</span>
        </div>
      </article>
    `;
  }).join('');
}

// 时间筛选
document.querySelectorAll('.time-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedTimeRange = btn.dataset.range;
    renderCategoryTabs();
    renderNewsGrid();
  });
});

// 初始化
renderCategoryTabs();
renderNewsGrid();
</script>
